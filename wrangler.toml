name = "rainbow-sudoku"
account_id = "c8b13d50e782530c28d6789c9990341b"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
routes = [
  { pattern = "prismku.com", custom_domain = true },
  { pattern = "www.prismku.com", custom_domain = true },
]

[build]
command = "node scripts/build.mjs"

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "rainbow-sudoku-db"
database_id = "db3c2c9f-c4c6-425e-9699-0ea8250505a8"
migrations_dir = "migrations"

[triggers]
crons = ["5 0 * * *"]

[observability]
enabled = true
